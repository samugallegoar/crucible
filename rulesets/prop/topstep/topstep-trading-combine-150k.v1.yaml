      trailing up with the end-of-day balance and locking at $0 permanently once the end-of-day balance
      reaches $4,500; from then on the balance can never fall below $0. The mark is the end-of-day balance
      (hwm_basis balance), the threshold is tested intrabar on equity (evaluated intraday, basis equity).
      The firm states a second trigger: ''After each Payout: Your Maximum Loss Limit (MLL) resets to $0
      permanently'' (and, on the payout policy page, ''Your MLL is set to $0 after your first Payout.
      If it''s already at $0, it stays there.''). lock.on lists both triggers, so the threshold freezes
      at $0 at whichever fires first.'
    amount_usd: '4500'
    mode: eod
    evaluated: intraday
    basis: equity
    hwm_basis: balance
    comparison: <=
    action: fail
