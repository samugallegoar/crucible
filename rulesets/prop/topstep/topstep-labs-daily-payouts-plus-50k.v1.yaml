  - kind: news_restriction
    rule_id: tier1_news_equity_index_minis
    description: 'Tier 1 news window: for the five minutes before and the five minutes after a Tier 1
      release no new opening transaction is permitted in the equity index minis (ES, NQ, RTY, YM, NKD),
      which is effect block. The page''s Tier 1 table names five events and their 5-minute windows: CPI
      7:30 AM CT, the FOMC rate decision 1:00 PM CT, the FOMC press conference 1:30 PM CT, NFP 7:30 AM
      CT and PPI 7:30 AM CT; every one of them is in the economic calendar this engine ingests. Positions
      opened before the window may be kept and managed through it, so nothing is flattened. The same table
      also blocks the metals minis (GC, SI, HG, PL), which are not in this ruleset''s instrument set,
      and the micros are not blocked but capped (the separate tier1_news_micro_contract_caps rule). The
      FOMC press conference is the one Tier 1 event whose release hour no Topstep or Federal Reserve HTML
      page states, so an event with no stated time is a coverage gap for that trade date: the news rules
      are not modeled for that day, the estimate is partial and the event ids are reported, never an invented
      whole-day blackout. A whole-day block is an owner-chosen sensitivity scenario, not what is simulated.'
