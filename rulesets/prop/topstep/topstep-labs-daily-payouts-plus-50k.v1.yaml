    quote: Purposefully trading your full Maximum Position Size directly into a scheduled major news event.
    section: Prohibited Trading Strategies
    synthetic: false
- rule: sub_minute_holding_and_micro_scalping
  description: 'Material for a one-minute bar. The published prohibition is on ALGORITHMIC scalping that
    exploits unrealistic simulator fills (''Running scalping algorithms designed to exploit unrealistic
    SIM fills''), and the page describes the behavior as ''intentional and systematic — usually hundreds
    or thousands of trades per day, with average durations measured in seconds, not minutes''. The seconds
    are an ILLUSTRATION of that pattern, not a universal threshold: a hold shorter than 60 seconds is
    not by itself a violation, and this file never fails an account for one. What no engine can see on
    one-minute bars is the intra-bar holding time and the trade cadence the judgement rests on.'
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/10305426-prohibited-trading-strategies-at-topstep
    snapshot_sha256: 04b662b2c733165c448a92ffafdad79232a7a3c1b8777e699098fd9f4ea19be2
    retrieved_at: '2026-11-22T01:37:23Z'
    quote: Running scalping algorithms designed to exploit unrealistic SIM fills
    section: The Do's and Don'ts of SIM Fills
    synthetic: false
- rule: cross_account_hedging
  description: 'Immaterial for ONE isolated simulated account. ''Cross-account hedging (single-user) —
    holding opposite positions across multiple accounts simultaneously'' is a rule about how many accounts
    a person runs; a single account cannot hedge itself. The condition on the materiality is declared
    rather than assumed: it becomes material when more than one account, copy trading or coordinated strategies
    are simulated.'
  materiality: immaterial
  source:
    url: https://help.topstep.com/en/articles/10296582-prohibited-conduct
