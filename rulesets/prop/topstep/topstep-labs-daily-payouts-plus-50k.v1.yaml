- rule: xfa_scaling_plan_ladder
  description: 'Material. The Express Funded Account''s maximum position size follows the Scaling Plan:
    ''The Scaling Plan is an Express Funded Account® (XFA) objective. It sets your Maximum Position Size
    — the max contracts you can hold at one time — based on your current account balance'', and the max
    contracts ''do not increase mid-session''. The ladder itself is published only as an image, saved
    at prop_snapshots/topstep/20261123_hc_scaling-plan-xfa-charts.png (sha256 55ec76b4b293822849c9bf8a8ac2de362fa895010d39ce9c0d00f4ed275e6cbd),
    so this file quotes no contract number from it and the funded phase''s own contract limit is NOT declared:
    the omission is this declared gap, never a firm rule, and the Trading Combine''s maximum is never
    substituted for it. A funded account therefore gets credit the plan would cap, which overstates the
    size it may hold.'
  materiality: material
  source:
