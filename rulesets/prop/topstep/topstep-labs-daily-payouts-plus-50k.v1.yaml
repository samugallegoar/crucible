- rule: news_full_position_size_prohibited
  description: 'Material and discretionary. ''Purposefully trading your full Maximum Position Size directly
    into a scheduled major news event.'' is a judgement with no numeric threshold: no window, size or
    event list makes it decidable, and inventing one would be inventing a firm rule. The simulator will
    happily trade a news window at full size, so the entry stays material.'
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/10305426-prohibited-trading-strategies-at-topstep
    snapshot_sha256: 04b662b2c733165c448a92ffafdad79232a7a3c1b8777e699098fd9f4ea19be2
