not_modeled:
- rule: xfa_scaling_plan_ladder
  description: Material. The Express Funded Account's maximum position size follows a Scaling Plan ladder
    of balance -> max contracts. The ladder is published only as images, so no contract number for a funded
    account can be quoted from the saved bytes. The funded phase therefore declares no contract limit,
    which overstates the size a real XFA may hold and gives a funded account credit the firm's Scaling
    Plan would cap. The drop page states no contract limit for the Express Funded Account it issues, so
    the funded phase declares none at all.
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/8284223-what-is-the-scaling-plan
    snapshot_sha256: 90a50f76af9363f786e18104d8612998a62a1fba54f027d3da48cee13e50c2ce
    retrieved_at: '2026-11-22T01:36:34Z'
    quote: As your balance grows, so does your buying power
    section: How It Works
    synthetic: false
- rule: news_full_position_size_prohibited
  description: Material. Purposefully trading the full Maximum Position Size directly into a scheduled
    major news event is prohibited. It is a discretionary judgement with no numeric threshold, so no rule
    can decide it; the simulator will happily trade the window with full size.
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/10305426-prohibited-trading-strategies-at-topstep
    snapshot_sha256: 04b662b2c733165c448a92ffafdad79232a7a3c1b8777e699098fd9f4ea19be2
    retrieved_at: '2026-11-22T01:37:23Z'
    quote: Purposefully trading your full Maximum Position Size directly into a scheduled major news event.
    section: Prohibited Trading Strategies
    synthetic: false
- rule: sub_minute_holding_and_micro_scalping
  description: Material. Topstep treats hundreds of trades a day with average durations measured in seconds
    as systematic SIM abuse. The simulator works on one-minute bars, so it cannot see intra-bar holding
    time and cannot fail an account for holding seconds.
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/10305426-prohibited-trading-strategies-at-topstep
    snapshot_sha256: 04b662b2c733165c448a92ffafdad79232a7a3c1b8777e699098fd9f4ea19be2
    retrieved_at: '2026-11-22T01:37:23Z'
    quote: Running scalping algorithms designed to exploit unrealistic SIM fills
    section: The Do's and Don'ts of SIM Fills
    synthetic: false
- rule: cross_account_hedging
  description: Immaterial for one simulated account. Holding opposite positions across multiple accounts
    simultaneously is prohibited; a single account cannot hedge itself, so the rule constrains how many
    accounts a person runs, not how one account trades.
  materiality: immaterial
  source:
    url: https://help.topstep.com/en/articles/10296582-prohibited-conduct
    snapshot_sha256: e40fa8e3c14e7137540bbe0eb2ae384d1bbb9c0410bf72ed8bac2f2edf0b15c7
    retrieved_at: '2026-11-22T01:37:22Z'
    quote: Cross-account hedging (single-user) — holding opposite positions across multiple accounts simultaneously
    section: What Is Prohibited Conduct?
    synthetic: false
- rule: two_percent_price_limit_restriction
  description: Immaterial for this instrument set. Holding a position within 2% of a product's price lock
    limit is prohibited. The engine carries no CME price-limit band, and the equity index products' limit
    bands sit far outside any one-minute bar the simulator sees, so the restriction cannot bind on this
    data.
  materiality: immaterial
  source:
    url: https://help.topstep.com/en/articles/10296582-prohibited-conduct
    snapshot_sha256: e40fa8e3c14e7137540bbe0eb2ae384d1bbb9c0410bf72ed8bac2f2edf0b15c7
    retrieved_at: '2026-11-22T01:37:22Z'
    quote: Holding a position within 2% of a product
    section: What Is Prohibited Conduct?
    synthetic: false
