    section: What Is Prohibited Conduct?
    synthetic: false
  becomes_immaterial_if: becomes material if multiple accounts, copy trading or coordinated strategies
    are simulated
- rule: two_percent_price_limit_restriction
  description: Material. 'Holding a position within 2% of a product' of its price-limit band is prohibited.
    The engine carries no CME price-limit band and no per-product limit schedule, so no rule can test
    it; the prohibition is hard and discretionary, and a run that silently ignored it would claim more
    than it can show. It stays material until an audit of the instruments and dates shows it never affected
    a trade.
  materiality: material
  source:
