    quote: During extreme volatility, we may temporarily tighten position limits on affected products.
    section: Position Limit Adjustments
    synthetic: false
- rule: static_xfa_drawdown_post_payout_reset
  description: 'Critical. The drop''s Express Funded Account Maximum Loss Limit is "$2,000 static,
    non-trailing" and "After first Payout, MLL sets to $0". static_drawdown expresses a static
    threshold exactly (the floor never moves with equity highs or daily closes) but has no
    post-payout reset or lock: the threshold_after_payout handler reaches trailing rules only.
    Modelling the floor alone would hold it at -$2,000 for the whole funded life, looser than the
    firm''s rule after any payout, and the trailing form is not this rule. So the funded phase
    declares NO maximum loss limit rather than an approximation, and a funded attempt on this file
    is unavailable on a critical unmodelled rule until the vocabulary gains a static lock (owner
    decision 2026-11-23).'
  materiality: critical
  source:
    url: https://help.topstep.com/en/articles/15520357-topstep-labs
    snapshot_sha256: 3eeff491464260ca00802775549db9a203644e81d726396227d1eaa1c191c9b1
    retrieved_at: '2026-11-22T01:53:10Z'
    quote: After first Payout, MLL sets to $0
    section: 'Phase 2: Express Funded Account (XFA) table (Static column)'
