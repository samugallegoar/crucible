- rule: volatility_position_limit_tightening
  description: Immaterial for this instrument set. Topstep may temporarily tighten position limits during
    extreme volatility, but the published restrictions cover energies, metals and Micro Bitcoin only;
    ES, NQ, YM, RTY, NKD and their micros are not restricted.
