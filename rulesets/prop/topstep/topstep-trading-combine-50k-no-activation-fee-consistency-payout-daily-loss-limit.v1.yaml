- rule: sub_minute_holding_and_micro_scalping
  description: 'Material for a one-minute bar. The published prohibition is on ALGORITHMIC scalping that
    exploits unrealistic simulator fills (''Running scalping algorithms designed to exploit unrealistic
    SIM fills''), and the page describes the behavior as ''intentional and systematic — usually hundreds
    or thousands of trades per day, with average durations measured in seconds, not minutes''. The seconds
    are an ILLUSTRATION of that pattern, not a universal threshold: a hold shorter than 60 seconds is
    not by itself a violation, and this file never fails an account for one. What no engine can see on
    one-minute bars is the intra-bar holding time and the trade cadence the judgement rests on.'
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/10305426-prohibited-trading-strategies-at-topstep
