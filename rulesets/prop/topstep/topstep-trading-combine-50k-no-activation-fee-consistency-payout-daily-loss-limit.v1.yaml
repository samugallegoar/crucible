- rule: volatility_position_limit_tightening
  description: Material. During extreme volatility Topstep 'may temporarily tighten position limits on
    affected products', its adjustments being 'Micro Contract Limits' and 'Mini Contract Restrictions'
    ('Trading on mini-sized contracts or larger may be temporarily halted for affected products'). No
    rule in the file could follow a limit the firm changes by announcement, and the published 'Current
    Restrictions' table lists energies (RB, HO, CL, MCL, QM), metals (GC, MGC, SI, SIL, HG, MHG, PL) and
    Micro Bitcoin (MBT) only — none of the nine equity-index roots this ruleset carries—so the tightening
    cannot bind on the evaluated instrument set as published, and an audit of the evaluated dates and
    sizes is what would make this entry immaterial.
  materiality: material
  source:
    url: https://help.topstep.com/en/articles/13613539-risk-adjustments-high-risk-high-volatility
