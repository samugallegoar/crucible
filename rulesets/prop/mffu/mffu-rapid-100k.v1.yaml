      rationale: 'No MFFU page states when the profit target is judged. Recorded default for a pass condition
        whose frequency the firm does not state: tested at the rule-day close on the closed balance, so
        the trader passes no earlier than the end of the trade date and a same-day breach after the target
        was touched still counts. The intraday alternative would pass the phase the moment equity touched
        the target and would hide that later breach.'
