    description: Every position is closed 50 minutes before the scheduled session close. The firm states
      its trading day as the 6:00 PM EST Globex open to "the New York session closes at 4:10 PM EST" and
      the CME session this engine reads closes at 5:00 PM ET, so 4:10 PM ET is 50 minutes before the
      session end. Declared session-relative so the clock moves with the calendar, so on a half day whose
      close is 13:15 ET the flat is 12:25 ET instead of a 4:10 PM clock that the session has already
      passed. The page writes EST; modeled as US Eastern time (DST included).
