      the threshold after the first payout rather than where it starts: "After first payout, MLL moves
      to $50,100 and remains static", so the lock is triggered by the first payout and freezes the threshold
      at that level (lock.on: first_payout). The funded starting balance is the account size, which the
      same sentence implies (a floor of $50,100 is only coherent for an account that started at $50,000)
      and which the payout buffer arithmetic confirms.'
