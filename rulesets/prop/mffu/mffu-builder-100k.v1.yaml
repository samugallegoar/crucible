- rule: consistency_target_over_two_max_daily_profit
  description: 'Material. The consistency page states the share measure this file models (no single day''s
    profit should exceed 30% or 50% of the total profit made) and, in its worked example, a second and
    stricter reading: the maximum profit a trader should achieve is the profit target divided by two.
    The share measure stays primary (packet F.28, delegated to the coordinator 2026-11-24). The target/2
    cap binds whenever total profit exceeds the target, and no field of this vocabulary expresses it exactly
    (consistency.measure is fixed to best_day_profit/total_profit and no rule kind compares one day''s
    profit with the profit target), so it is declared here instead of modelled and it produces no sensitivity
    scenario.'
  materiality: material
  source:
    url: https://help.myfundedfutures.com/en/articles/11994562-consistency-rule-at-my-fundedfutures
    quote: 'Total Profit Target on a 50k account: $3,000 Max Profit a Trader should achieve: $1,500 Calculation
      is: Total profit target / 2 = Max Daily Profit'
