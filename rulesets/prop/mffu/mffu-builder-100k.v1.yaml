    - name: session_relative_flat_follows_the_cme_early_close
      rationale: 'The firm states a fixed 4:10 PM ET clock ("can remain open until the New York session
        closes at 4:10 PM EST") and the model keeps the 50 minutes fixed against the CME session close
        (17:00-16:00 CT, i.e. 5:00 PM ET), so a 13:15 ET half day closes positions at 12:25 ET instead
        of 4:10 PM. Reading the clock as session-relative is the owner''s decision of 2026-11-24 (assumption_kind:
        owner_decision, delegated to the coordinator, packet F.31): it closes EARLIER on a half day, which
        is the stricter direction, and the untraded half of the rule is the material not_modeled entry
        holiday_early_close_is_the_traders_job.'
