  - kind: compliance
    rule_id: compliance_no_copy_trading_or_account_sharing
    description: 'Material. Copy trading between traders, using another trader''s device and collaborating
      across unconnected accounts to run identical or opposite strategies are prohibited. A single simulated
      attempt is one trader on one account, so this cannot change its mechanics; it decides practical
      eligibility for a submission that is a copy of someone else''s trades. The firm''s copy-trading
      article bounds this ban: it permits copy trading across all account types and names a trade copier,
      so what is prohibited here is copying ANOTHER trader, never a copier across the trader''s own accounts
      (packet F.30, the article is a supporting source). A copier across one''s own accounts that holds
      opposite exposure on the same underlying is what the immaterial not_modeled entry cross_account_hedging
      turns on.'
