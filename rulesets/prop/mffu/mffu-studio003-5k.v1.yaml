      article bounds this ban: it permits copy trading across all account types and names a trade copier,
      so what is prohibited here is copying ANOTHER trader, never a copier across the trader''s own accounts
      (packet F.30, the article is a supporting source). A copier across one''s own accounts that holds
      opposite exposure on the same underlying is what the immaterial not_modeled entry cross_account_hedging
