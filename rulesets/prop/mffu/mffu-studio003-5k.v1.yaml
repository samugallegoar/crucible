not_modeled:
- rule: sub_minute_holding_and_micro_scalping
  description: 'Material. MFFU prohibits high-frequency trading and any exploitation of the simulated
    fill engine, which targets holdings shorter than a bar. The simulator reads OHLC bars, so a holding
    time below the bar cannot be measured and a micro-scalping pattern is invisible: the model can keep
    an account whose real holding-time would be refused, and it cannot fail a sub-minute rule the firm
    would enforce.'
  materiality: material
  source:
    url: https://help.myfundedfutures.com/en/articles/8444599-fair-play-and-prohibited-trading-practices
    quote: High-frequency Trading is not allowed on our plans.
    snapshot_sha256: 29dac8bf2f268f5a1959ae5d612a9c17aeb51c0fb2d11074d22f3d92c8c8e9d9
    retrieved_at: '2026-11-22T01:36:50Z'
    section: 'Section 1: Automated Trading Protocols'
    synthetic: false
- rule: price_limit_2pct_prohibition
  description: 'Material. Trading is prohibited while a product trades within 2% of its CME price limit,
    on Sim Funded and Live accounts (the firm says equity index price limits are suspended for it in that
    band). The ruleset holds no price-limit bands, so a bar in a limit move stays tradable here and a
    strategy that trades a limit day would differ. The 2024 ES audit in the review''s reference run (ES
    never traded at its CME price limit in 2024) is not the firm''s band test: the rule is about trading
    while the product is within 2% of the limit, which an audit of limit hits does not measure. The entry
    therefore stays material (packet F.20, delegated to the coordinator 2026-11-24).'
  materiality: material
  source:
    url: https://help.myfundedfutures.com/en/articles/9698984-2-price-limit-rule
    quote: we enforce strict guidelines to prevent trading when a product is within 2% of a CME price
      limit .
    snapshot_sha256: 57a9706131ad161e9d151fbf10dd2012292d1c64960349dbb742e60593363370
    retrieved_at: '2026-11-22T01:40:10Z'
    section: 2% Price Limit Rule
    synthetic: false
- rule: cross_account_hedging
  description: Immaterial. The firm's hedging ban extends to the CME Rule 534 guideline against hedging
    across accounts. One simulated attempt is one account, so a cross-account hedge cannot exist inside
    it and the ban cannot change a simulated outcome.
  materiality: immaterial
  source:
    url: https://help.myfundedfutures.com/en/articles/12011241-hedging-what-you-should-know
    quote: 'Note: All traders must abide by the CME guidelines on hedging.'
    snapshot_sha256: 671a46f7f3849afe15ae3a98179acb2234a804da88b0838a1225c6fb6d851139
    retrieved_at: '2026-11-22T01:38:58Z'
    section: Hedging - What You Should Know
    synthetic: false
  becomes_immaterial_if: 'becomes material if several accounts, copy trading or coordinated strategies
    are simulated: a trade copier that mirrors one of the trader''s own accounts onto another can hold
    opposite exposure on the same underlying across the two, which is exactly the cross-account hedge
    this entry does not model (packet F.9 and F.30, delegated to the coordinator 2026-11-24)'
- rule: holiday_early_close_is_the_traders_job
  description: Material. The flat clock now follows the CME calendar's own early close, but the firm does
    not liquidate anyone at the half-day close - the trader is responsible for being flat and holding
    past it breaches the account - while flat_by liquidates for the trader. So where a real account that
    held into a half-day close would be breached, this model closes the position 50 minutes before it
    and the attempt can survive.
  materiality: material
  source:
    url: https://help.myfundedfutures.com/en/articles/9558251-permitted-times-to-trade
    quote: During holiday trading hours, auto-liquidation will not occur at the half-time market close,
      and the trader is responsible for closing the positions.
    snapshot_sha256: 7a945cf52a94820af413c95e6fcdb381fe51b4e8039bae4f7d46e63bc13e2b98
    retrieved_at: '2026-11-22T01:38:12Z'
    section: Permitted Times to Trade
    synthetic: false
- rule: discretionary_news_trading_practices
  description: 'Material. Beyond the Tier 1 windows, the firm prohibits news strategies as such: straddles
    or strangles around an immediate news burst, and masking a news trade as a standard strategy, "for
    all news releases" on every account. That is a judgement about intent and cannot be decided from OHLC
    bars or from a calendar window, so it is declared here and never enforced mechanically.'
  materiality: material
  source:
    url: https://help.myfundedfutures.com/en/articles/8230009-news-trading-policy
    quote: Utilizing strategies that exploit immediate news bursts, such as straddles or strangles. Masking
      news trades as standard strategies. These prohibitions are in effect for all news releases.
    snapshot_sha256: 661236c1900074748970098a9bf681db14d0e5dc4e31119a6e54ca32f091ee4c
