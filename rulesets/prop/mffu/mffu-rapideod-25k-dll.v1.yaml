    description: '$500 Daily Loss Limit of the DLL add-on, in effect in this stage as the add-on page
      states ("It applies in both the Evaluation and Sim Funded stages"). Hitting it is a soft pause,
      not a breach: trading stops for the rest of the session and the account survives, and it "resets
      daily at 6:00 PM ET", which is the rule-day boundary. Neither the reference balance nor the basis
      is published; the rule is modeled on the rule-day''s opening balance and on equity under the assumption
      daily_loss_basis_and_reference_are_not_published.'
