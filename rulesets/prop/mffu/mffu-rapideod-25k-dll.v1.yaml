      rationale: The pages state the Daily Loss Limit amount, that hitting it is a soft pause and not
        a breach, and (Rapid EOD) that it resets daily at 6:00 PM ET. They state neither the reference
        balance nor the basis. Modeled on the rule-day's opening balance and on equity (open losses counted),
        the stricter combination, consistent with the firm's EOD drawdown article that counts open equity
