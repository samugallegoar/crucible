not_modeled:
- rule: sub_minute_holding_and_high_frequency_trading
  description: Material. Apex prohibits exploitation of the simulation environment including high frequency
    trading, and its high-risk-strategy rule targets tick-sized targets. The simulator reads OHLC bars,
    so a holding time shorter than the bar or a micro-scalping pattern cannot be detected or enforced;
    a sub-minute rule can fail an account the bar model keeps.
  materiality: material
  source:
    url: https://apextraderfunding.com/help-center/getting-started/prohibited-activities
    quote: 'Manipulation of the simulated trading environment: Apex Trader Funding strictly prohibits
      manipulation or exploitation of the simulation environment in any way, including High Frequency
      Trading (HFT) or any other exploitative strategies.'
    snapshot_sha256: 494fd6da079ceaec93f14a5f8ea97299fb7cd9b212bf6fc5e62f00ba6d170c9c
    retrieved_at: '2026-11-22T01:36:46Z'
    section: Prohibited Activities
    synthetic: false
- rule: within_account_hedging_of_correlated_instruments
  description: Material. Holding long and short positions simultaneously on the same or a correlated instrument
    is prohibited and closes the account. A single simulated account holds one net position per instrument,
    so it cannot hold both sides of the same root, but a long NQ against a short ES is representable and
    the engine has no correlated-instrument logic.
  materiality: material
  source:
    url: https://apextraderfunding.com/help-center/getting-started/prohibited-activities
    quote: No Hedging of Any Kind – Directional Trading only . Holding both long and short positions simultaneously
      on the same or correlated instrument is strictly prohibited.
    snapshot_sha256: 494fd6da079ceaec93f14a5f8ea97299fb7cd9b212bf6fc5e62f00ba6d170c9c
    retrieved_at: '2026-11-22T01:36:46Z'
    section: Prohibited Activities
    synthetic: false
- rule: news_trading_restriction_is_discretionary
  description: Material. Apex allows news trading for a normal strategy but prohibits news strategies
    that chase the market or place orders on both sides to gamble the outcome. The page names no event
    type (no FOMC, CPI or NFP), no restricted instrument, no pre- or post-window and no scope, so there
    is nothing to model as a news_restriction; it is judged by Apex, not by a calendar window.
  materiality: material
  source:
    url: https://apextraderfunding.com/help-center/getting-started/prohibited-activities
    quote: 'NEWS TRADING: Trading during news is allowed for your normal trading strategy. Using “news
      trading” strategies that “chase the market” or place orders on both sides but to be lucky or gamble
      the outcome of news is not allowed.'
    snapshot_sha256: 494fd6da079ceaec93f14a5f8ea97299fb7cd9b212bf6fc5e62f00ba6d170c9c
    retrieved_at: '2026-11-22T01:36:46Z'
    section: Prohibited Activities
    synthetic: false
