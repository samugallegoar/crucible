  - kind: activity_requirement
    rule_id: pa_activity_requirement
    description: 'The PA must record at least 2 trading days with $50 or more of net profit within EVERY
      rolling 30 calendar days; the system checks the most recent 30-day lookback each day and closes
      the account, forfeiting payout eligibility, when the check fails. A qualifying day is one whose
      trading session ends with at least $50 of net profit (a breakeven day does not count), and it is
      assigned to the date its session ends. The engine tests every full rolling 30-calendar-day window
      ending at a rule-day close, starting from the PA''s first day: a window is judged only once it is
      full, and it is a close of the account before the pass conditions. Apex''s own phrasing (''the earlier
      of your 2 most recent qualifying days'') is the same condition: that day falls outside the lookback
      exactly when the count is short.'
