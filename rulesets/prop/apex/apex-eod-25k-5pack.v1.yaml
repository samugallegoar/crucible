      share that must hold for the phase to pass. The measure and the window are the payout consistency
      rule''s (largest profitable day / total net profit, since inception because an evaluation has no
      payout), so the two windows are the same and only `window` is declared. The alternative reading
      is that the rule does not exist at all (`value: absent`), which is exactly what ''Consistency Not
