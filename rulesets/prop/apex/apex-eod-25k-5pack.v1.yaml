  - kind: flat_by
    rule_id: flat_before_session_end
    description: 'Every position must be closed before the market close; a position still open when the
      scheduled session is about to end is a prohibited activity (holding through the market close) that
      forfeits the account, so the consequence is a fail rather than an automatic liquidation: Apex states
      it does not flatten for you. The deadline is declared relative to the CME session''s scheduled close
      (minutes_before_session_end: 1, because 4:59 PM ET is one minute before the 5:00 PM ET end of a
      regular session), so a holiday early close moves it with the calendar instead of a guessed fixed
      clock. The daily 5-6 PM ET maintenance break leaves no bar to trade before the 6:00 PM ET reopen,
      so no reopen clock is declared (a session-relative close has no clock time zone to place one in).
      A session the CME table cannot source is reported by the engine as a coverage gap, never treated
      as a regular day.'
