      section: LucidFlex Funded Account Scaling Plan
    evidence: official_quote
    assumptions:
    - name: flex_scaling_ladder_is_read_on_simulated_profit
      rationale: 'The ladder is keyed on the simulated profit since the phase start, which the page
        prints as its ''Simulated Profits'' column, not on an absolute balance. The vocabulary has
        no profit basis for a scaling plan, so the steps declare min_profit_usd and basis: balance,
        which is exactly equivalent here: profit is the balance above the starting balance, and a
        payout only lowers that balance, which the page itself says adjusts the tier downward. The
        printed bands are inclusive ($0-$999, $1,000-$1,999, ...), so a profit of exactly $1,000 is
        in the $1,000-$1,999 band and a rung is read at >= its threshold, which is the engine''s own
        reading of the profit form. The owner review of 2026-11-24 (F23, delegated to the
        coordinator 2026-11-24) settled the basis and the boundary.'
      assumption_kind: owner_decision
    supporting_sources:
