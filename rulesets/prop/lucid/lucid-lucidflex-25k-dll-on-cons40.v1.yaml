    rule_id: funded_scaling_plan
    description: 'Funded contract limit from the simulated profit at the previous rule-day''s close: $0+
      -> 1 mini, $1,000+ -> 2 mini. The limit updates at the end of each session (never intrabar), so
      the next rule-day trades the tier the last close chose. An over-size target is clipped.'
    source:
      url: https://support.lucidtrading.com/en/articles/12945808-lucidflex-scaling-plan
      quote: The scaling plan updates at the end of each session
      snapshot_sha256: c4f7ea67af7544d588984366b6d4a70b1d8ba8ca5e481cd7aaad4f7abb30935f
