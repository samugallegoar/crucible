  - kind: inactivity
    rule_id: funded_inactivity
    description: 'An account with no trade for more than 30 calendar days is deemed abandoned and
      permanently deleted. The page says it outright: ''Accounts that have not been traded resulting
      in at least a net profit or loss of 1$ within 30 calendar days will be deemed abandoned and
      will be permanently deleted from our systems''. It is modelled as a hard fail at the start of
      the 31st calendar day after the last EXECUTED trade, the pessimistic reading of a rule whose
      page says the account is deleted. The page also asks for at least $1 of net profit or loss on
      the trade, which the engine cannot separate from an executed trade at a zero result: a day
      counts on an executed trade, as for Topstep. The owner review of 2026-11-24 (F22, delegated to
      the coordinator 2026-11-24) added the rule; it was declared as modelled in RESEARCH.md section
      1 before any file carried it.'
