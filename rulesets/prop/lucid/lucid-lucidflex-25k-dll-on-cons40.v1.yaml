        whether open equity is tested against the threshold between closes. The test is taken on
        equity intrabar, the stricter reading. The owner review of 2026-11-24 (F5, delegated to the
        coordinator 2026-11-24) accepted the intraday test as the more restrictive reading and
        recorded it as an owner decision rather than a section 7 default.
