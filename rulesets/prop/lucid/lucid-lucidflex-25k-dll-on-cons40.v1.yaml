      rationale: 'The page writes the cutoff in ''EST''. It is read as America/New_York WITH
        daylight saving, so the cutoff stays 4:45 PM local all year: that is the market-clock
        meaning. A fixed UTC-5 offset does not mean that: 4:45 PM EST is 21:45 UTC, which in summer
        (EDT, UTC-4) is 5:45 PM local, 45 minutes AFTER the 5:00 PM ET futures close the offset is
        measured from, so the firm would be flattening an account the session has already ended. The
        owner review of 2026-11-24 (F7, delegated to the coordinator 2026-11-24) took that reading
        as an owner decision; a fixed UTC-5 sensitivity scenario is not expressible in the scenario
        vocabulary, which is recorded in RESEARCH.md section 17.'
