    rule_id: funded_payout
    description: Five profitable days inside the payout cycle, each earning at least $100, plus positive
      net profit in the cycle; no buffer balance is required, so the whole profit above the starting balance
      is withdrawable. The request is capped at $1,000, at 50% of the account balance and at 50% of the
      withdrawable profit (the smallest binds). 90/10 split, minimum request $500, at most 5 payouts,
      and requesting the first payout locks the max-loss limit at the locked balance.
