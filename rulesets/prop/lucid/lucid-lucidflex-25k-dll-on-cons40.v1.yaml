  - kind: flat_by
    rule_id: eval_flat_by_close
    description: Every position is closed by the firm at 4:45 PM ET; holding past the cutoff does not
      fail the account, and no entry is admitted until the 6:00 PM ET session reopen. The page writes
      'EST'; it is modelled as America/New_York so the cutoff stays 4:45 PM local under daylight saving.
      The fixed clock is kept because only that form can carry the 6:00 PM ET reopen; the earlier
      close of a holiday session is the separate session-relative rule eval_flat_by_close_early_close.
