  - kind: consistency
    rule_id: funded_consistency_payout
    description: The largest single day's profit may be at most 40% of the total profit in the payout
      cycle, and both sides of the ratio reset after every approved payout, so it gates the payout, not
      the pass. The two windows are declared separately because the page states each one, the best day is
      taken from the cycle (since the last payout) and the profit it is measured against is the profit of
      the cycle, measured from the balance the cycle opened at. Accounts bought or reset before
      11/28/2025 at 3:00 PM EST keep 35%; this ruleset describes an account bought now.
    source:
      url: https://support.lucidtrading.com/en/articles/12890109-lucidpro-consistency-percentage
      quote: In our LucidPro funded accounts you must meet a Consistency Percentage of 40% to be eligible
