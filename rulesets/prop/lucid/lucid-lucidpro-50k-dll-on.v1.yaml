phases:
- phase_id: evaluation
  kind: evaluation
  starting_balance_usd: '50000'
  rules:
  - kind: trailing_drawdown
    rule_id: eval_trailing_drawdown
    description: Trailing max loss of $2,000 on the rule-day close high-water mark of the balance. It
      locks at the initial balance plus $100 once the mark reaches the Initial Trail Balance at +$2,100,
      so the locked floor is the starting balance plus $100. The page says the mark is the highest closing
      balance and that the account is breached when the balance reaches the MLL, but never says whether
      open equity is tested between closes; the test is therefore taken on equity intrabar, the harder
      reading.
    source:
      url: https://support.lucidtrading.com/en/articles/12890136-lucidpro-drawdown
      quote: $50,000 $2,000 $52,100 $50,100
      snapshot_sha256: 5afa8d7876c86b876e186cde15d5d1b3fcc0613bcbda39e81b56b07c8aa3ed52
      retrieved_at: '2026-11-22T01:53:35Z'
      section: End of Day Drawdown
    evidence: assumption
    assumption:
      name: unspecified_failure_frequency_is_intraday
      rationale: The firm states the max-loss amount and the mark it trails from, and never says whether
        open equity is tested against the threshold between closes. ADR-0107 section 7 reads an unspecified
        observation frequency of a failure threshold as intraday, which is the stricter reading.
    amount_usd: '2000'
    mode: eod
    evaluated: intraday
    basis: equity
    hwm_basis: balance
    comparison: <=
    action: fail
    lock:
      'on':
      - hwm
      at_offset_usd: '2100'
      locked_offset_usd: '100'
  - kind: daily_loss
    rule_id: eval_fixed_dll
    description: 'Fixed daily loss limit of $1,200 on the day''s starting balance, a soft breach: reaching
      it locks new entries until the rule-day''s reset at 18:00 America/New_York and the account survives
      unless the max-loss limit is also reached. The page gives the amount and the soft-breach treatment
      only; the reset instant is derived from the firm''s session reopen (assumption) and the intraday
      equity test is the stricter reading of an unstated frequency. The page notes that the limit stays
      fixed and that the max-loss limit becomes the stricter threshold once it trails above it.'
    source:
      url: https://support.lucidtrading.com/en/articles/12890122-lucidpro-daily-loss-limit
      quote: $50,000 $1,200
      snapshot_sha256: b39ee2a32d422a3201e012329a83f7351d834017c983ab0b3b0b00f87b1cb3e4
      retrieved_at: '2026-11-22T01:53:35Z'
      section: LucidPro Evaluation Account DLL
    evidence: assumption
    assumption:
      name: dll_reset_at_6pm_et_session_reopen
      rationale: The DLL page says trading is restricted 'until the next trading session' and never gives
        the reset instant. Allowed Trading Times states 'Trading resumes at 6:00 PM EST, Sunday through
        Thursday', so the rule-day boundary is 18:00 America/New_York (ADR-0107 section 7 reads EST as
        US Eastern time with DST).
    amount_usd: '1200'
    reference: day_start_balance
    basis: equity
    evaluated: intraday
    comparison: <=
    action: soft_lock_until_reset
    reset:
      time: '18:00:00'
      tz: America/New_York
  - kind: max_contracts
    rule_id: eval_max_contracts
    description: 'At most 4 mini contracts or 40 micros at any time, measured by contract weight (one
      mini weighs 1, one micro 0.1). An over-size target is clipped to the limit, not rejected: the page
      states a maximum size, not a breach consequence. '
    source:
      url: https://support.lucidtrading.com/en/articles/12890029-lucidpro-evaluation-account
      quote: $50,000 $3,000 $2,000 $1,200 4 mini or 40 micros
      snapshot_sha256: a29879aee6839490f27cb3ee9d8e3832e26e9afcb528cc48b1253d9009f512ea
      retrieved_at: '2026-11-22T01:53:35Z'
      section: LucidPro Evaluation Account Overview
    evidence: official_quote
    limit: '4'
    comparison: <=
    action: clip
  - kind: flat_by
    rule_id: eval_flat_by_close
    description: Every position is closed by the firm at 4:45 PM ET; holding past the cutoff does not
      fail the account, and no entry is admitted until the 6:00 PM ET session reopen. The page writes
      'EST'; it is modelled as America/New_York so the cutoff stays 4:45 PM local under daylight saving.
      The fixed clock is kept because only that form can carry the 6:00 PM ET reopen; the earlier
      close of a holiday session is the separate session-relative rule eval_flat_by_close_early_close.
    source:
      url: https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times
      quote: All positions must be closed by 4:45 PM EST, Monday through Friday
      snapshot_sha256: 9f536c25e65e1f5bd5a622ce2f3d54cb9b3187f303f4f724dea856344f2b84db
      retrieved_at: '2026-11-22T01:53:35Z'
      section: LucidPro, LucidFlex and LucidDirect Accounts
    evidence: assumption
    assumption:
      name: est_means_america_new_york
      rationale: The page writes the cutoff in 'EST'. ADR-0107 section 7 reads a bare US Eastern label
        as America/New_York including daylight saving, which keeps the 4:45 PM ET close at 4:45 PM local
        all year; a literal UTC-5 clock would shift the cutoff an hour in summer.
    time: '16:45:00'
    tz: America/New_York
    reopen: '18:00:00'
    comparison: <=
    action: auto_liquidate
  - kind: flat_by
    rule_id: eval_flat_by_close_early_close
    description: On a market holiday with an altered close every position must be flat before the
      market closes, whatever the usual 4:45 PM ET cutoff. The rule is declared relative to the
      scheduled session end, so the close comes from the CME session calendar instead of a guessed
      clock time, and 4:45 PM ET is the firm's own fifteen minutes before the scheduled 5:00 PM ET
      (16:00 Chicago) equity-index close, and the same fifteen minutes is taken before an earlier
      holiday close. A session the calendar cannot source (the 2023 holidays other than Labor Day,
      Christmas and New Year, and MLK 2024) is reported by the engine as a session-calendar gap at
      attempt time, never repaired here.
    source:
      url: https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times
      quote: On market holidays with altered closing times, all positions must be closed before the
        market closes, regardless of the usual 4:45 PM cutoff
      snapshot_sha256: 9f536c25e65e1f5bd5a622ce2f3d54cb9b3187f303f4f724dea856344f2b84db
      retrieved_at: '2026-11-22T01:53:35Z'
      section: Allowed Trading Times
    evidence: official_quote
    minutes_before_session_end: 15
    comparison: <=
    action: auto_liquidate
  pass_conditions:
  - kind: profit_target
    rule_id: eval_profit_target
    description: 'Pass condition: $3,000 of profit above the starting balance. The firm states the target
      and no minimum trading day; it never says when the target is measured, so it is tested at the rule-day
      close on closed balance (assumption), the conservative reading: the trader passes no earlier, and
