      url: https://support.lucidtrading.com/en/articles/12890029-lucidpro-evaluation-account
      quote: $50,000 $3,000 $2,000 $1,200 4 mini or 40 micros
      snapshot_sha256: a29879aee6839490f27cb3ee9d8e3832e26e9afcb528cc48b1253d9009f512ea
      retrieved_at: '2026-11-22T01:53:35Z'
