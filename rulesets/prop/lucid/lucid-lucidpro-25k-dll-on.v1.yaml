  - kind: consistency
    rule_id: funded_consistency_payout
    description: The largest single day's profit may be at most 40% of the total profit in the payout
      cycle, and both sides of the ratio reset after every approved payout, so it gates the payout, not
      the pass. The two windows are declared separately because the page states each one, the best day is
      taken from the cycle (since the last payout) and the profit it is measured against is the profit of
      the cycle, measured from the balance the cycle opened at. Accounts bought or reset before
      11/28/2025 at 3:00 PM EST keep 35%; this ruleset describes an account bought now.
    source:
      url: https://support.lucidtrading.com/en/articles/12890109-lucidpro-consistency-percentage
      quote: In our LucidPro funded accounts you must meet a Consistency Percentage of 40% to be eligible
        to request a payout.
      snapshot_sha256: b39eb214c9d2885ea1e8a62d9ed6ce0782aaf7081526a67c507d0b8909330e08
      retrieved_at: '2026-11-22T01:53:35Z'
      section: The Calculation
    evidence: official_quote
    assumptions:
    - name: consistency_share_boundary_excludes_the_limit
      rationale: 'The page states the requirement as a floor in words (''you must meet a Consistency
        Percentage of 40%'') and its own worked example resolves the boundary: 1,000 of 4,000
        dollars is 25% and is called consistent, and the page then says ''if your largest day had
        exceeded 40% of your Account Profit, you would need to continue trading until your largest
        day is below 40%''. ''Below 40%'' excludes 40 itself, so the comparison is strict (<) and a
        best day at exactly 40.000% blocks the payout. The owner review of 2026-11-24 (F18,
        delegated to the coordinator 2026-11-24) took the more restrictive reading; because the
        wording states no inclusive boundary, the reading is provisional_conservative.'
      assumption_kind: provisional_conservative
