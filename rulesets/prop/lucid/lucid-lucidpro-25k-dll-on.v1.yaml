  rationale: The funded account page states a $600 fixed daily loss limit for the $25,000 size and the
    daily-loss page funded table states None for the same size and phase, so the two official pages
    contradict. Both describe the same firm, plan, account size and phase, so this is one requirement
    read twice, not two products. The $600 (the stricter reading) is selected and the alternative is the
    rule being absent, which the sensitivity scenario drops rather than switching a value to a limit the
    rule kind cannot express. The scenario is a sensitivity reading, never the plan.
