  - kind: flat_by
    rule_id: eval_flat_by_close_early_close
    description: On a market holiday with an altered close every position must be flat before the
      market closes, whatever the usual 4:45 PM ET cutoff. The rule is declared relative to the
      scheduled session end, so the close comes from the CME session calendar instead of a guessed
      clock time, and 4:45 PM ET is the firm's own fifteen minutes before the scheduled 5:00 PM ET
      (16:00 Chicago) equity-index close, and the same fifteen minutes is taken before an earlier
      holiday close. A session the calendar cannot source (the 2023 holidays other than Labor Day,
      Christmas and New Year, and MLK 2024) is reported by the engine as a session-calendar gap at
      attempt time, never repaired here.
    source:
      url: https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times
      quote: On market holidays with altered closing times, all positions must be closed before the
        market closes, regardless of the usual 4:45 PM cutoff
