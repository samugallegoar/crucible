      locks at the initial balance plus $100 once the mark reaches the Initial Trail Balance at +$1,100,
      so the locked floor is the starting balance plus $100. The page says the mark is the highest closing
      balance and that the account is breached when the balance reaches the MLL, but never says whether
      open equity is tested between closes; the test is therefore taken on equity intrabar, the harder
      reading.
