        measured from, so the firm would be flattening an account the session has already ended. The
        owner review of 2026-11-24 (F7, delegated to the coordinator 2026-11-24) took that reading
        as an owner decision; a fixed UTC-5 sensitivity scenario is not expressible in the scenario
        vocabulary, which is recorded in RESEARCH.md section 17.'
