  - kind: news_restriction
    rule_id: funded_news_restriction
    description: 'LucidDaily funded accounts may not trade U.S. high-impact (''red folder'') news: the
      account must be flat from one minute before through one minute after the event, may not hold or
      open a position inside that window, and a violation is a hard breach. The effect is block, never a
      size cap, so an entry is refused and a position is flattened before the window. The firm names no
      release type, so the rule carries every U.S. high-impact type the economic calendar holds (FOMC
      statements, press conferences and minutes, CPI, NFP and PPI), the reading that restricts the
      strategy most; a U.S. high-impact release outside that set stays declared as unmodelled, and a
      press-conference or minutes date whose release hour no source states is reported by the engine as
      an uncovered event, never as no news.'
    source:
      url: https://support.lucidtrading.com/en/articles/15997244-luciddaily-funded-account
      quote: You must be flat from 1 minute before through 1 minute after the news event.
