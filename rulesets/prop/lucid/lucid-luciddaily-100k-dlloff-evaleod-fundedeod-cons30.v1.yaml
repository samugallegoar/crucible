- rule: microscalping_ban
  description: More than 50% of profits earned from trades held 5 seconds or less is prohibited and the
    profits are forfeited after a warning; a holding-time distribution cannot be evaluated on OHLC bars,
    and a sub-minute holding rule is outside the rule vocabulary (ADR-0107 section 13).
