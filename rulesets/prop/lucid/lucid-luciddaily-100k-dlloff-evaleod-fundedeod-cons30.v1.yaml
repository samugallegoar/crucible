    section: What Happens If I Microscalp?
- rule: cross_account_hedging
  description: 'Immaterial. Opposing positions on the same contract in separate accounts, and
    opposing positions on correlated contracts across accounts, are prohibited: the accounts are
    reset to a prior day''s balance, lose on-demand payout eligibility, and repeat offences breach
    every account. The attempt model simulates one account with a one-sided book, so a cross-account
    hedge can neither arise nor be detected (ADR-0107 section 13). The owner review of 2026-11-24
    (F16, delegated to the coordinator 2026-11-24) lowered the entry to immaterial, as the Apex
    round did (Apex F10), and recorded the fact that would make it bind.'
  materiality: immaterial
  becomes_immaterial_if: becomes material if several accounts, copy trading or coordinated
    strategies are simulated
  source:
    url: https://support.lucidtrading.com/en/articles/11404734-prohibited-hedging
    quote: Lucid Trading strictly prohibits all forms of hedging
    snapshot_sha256: 46dd94de490cde87dee27d344d3ae55294407ded3c038faa38a3cfe91b818bd4
    retrieved_at: '2026-11-22T01:53:35Z'
    section: Prohibited Forms of Hedging
- rule: evaluation_and_reset_fees
  description: 'The evaluation is bought for a one-time fee with no subscription and no automatic rebilling,
    and a failed evaluation can be restarted only by buying a reset; no readable official page publishes
    either amount (the price list sits on the Cloudflare-blocked lucidtrading.com). The ruleset therefore
    carries no fee rule: the attempt''s cost side and its net cash are understated by the evaluation price
    plus any resets, so any cost-dependent statistic is conditional at best.'
  materiality: material
  source:
    url: https://support.lucidtrading.com/en/articles/11404620-simulated-account-fees
    quote: LucidPro Evaluation and LucidDirect accounts are purchased by paying a one-time fee.
    snapshot_sha256: c89f021ecbe4ce2286f8bca70eb26667f1963a9799cc55524534fb49face75f3
    retrieved_at: '2026-11-22T01:53:35Z'
    section: One-Time Fee
- rule: discretionary_prohibited_strategies
  description: 'A conduct list with no quantitative trigger: exploiting system errors, update delays or
    simulated price discrepancies, and tactics that do not reflect real-world conditions. Not decidable
    from bar data; the whole account can be reviewed and profits removed.'
  materiality: immaterial
  source:
    url: https://support.lucidtrading.com/en/articles/11404732-trade-with-integrity
    quote: Lucid Trading strictly prohibits the use of strategies that exploit platform mechanics or simulated
      market conditions.
    snapshot_sha256: 82b064e5656b16d32997479017dcfabbf274504abb9480e992b409450aefff2e
    retrieved_at: '2026-11-22T01:53:35Z'
    section: What We Prohibit
- rule: live_transition_discretionary
  description: The ruleset stops at the funded phase. The move to live is discretionary and reviewed by
    the risk team (after the final payout, a large lifetime payout, the maximum daily profit, or exceptional
    performance), and the live account has its own drawdown, contract limits and monthly bonus.
  materiality: immaterial
  source:
    url: https://support.lucidtrading.com/en/articles/16558826-new-live-structure
    quote: All live transitions occur at the discretion of the Lucid risk team.
    snapshot_sha256: 2889425cbfb62513b05c1925131b0b75a61dadffe8dbe3c592f68f3c645930f3
    retrieved_at: '2026-11-22T01:53:35Z'
    section: Being Evaluated for Live
- rule: max_accounts_per_household
  description: At most 10 accounts in total across evaluation and funded accounts, of which at most 5
    are funded and up to 5 evaluation accounts may be held in reserve. This is a portfolio limit across
    accounts; the attempt model simulates one account at a time.
  materiality: immaterial
  source:
    url: https://support.lucidtrading.com/en/articles/11404617-maximum-number-of-accounts
    quote: Traders may hold a maximum of 10 accounts in total across evaluation accounts and funded accounts.
    snapshot_sha256: 34c143e8ff1d96874afb91c5a20c5c15f53b9e6cadf48cc7e34a8882151f9d3f
    retrieved_at: '2026-11-22T01:53:35Z'
    section: Maximum Number of Accounts
- rule: other_us_high_impact_events
  description: The funded news rule bans trading every U.S. high-impact ('red folder') release, and the
    firm names no event type. The economic calendar carries six U.S. high-impact types (FOMC statements,
    press conferences and minutes, CPI, NFP and PPI) and the news rule enforces every one of them; any
    other U.S. high-impact release (retail sales, GDP, ISM and the like) is outside the modelled window,
    so the attempt stays conditional on those not landing inside it.
  materiality: material
  source:
    url: https://support.lucidtrading.com/en/articles/15997244-luciddaily-funded-account
    quote: Trading U.S high impact red folder news in a LucidDaily funded account is not permitted and
      is a hard breach.
    snapshot_sha256: c5729e820b33ead241204020c4489e2687ea1f90e0418692e3c0a3874946ea77
    retrieved_at: '2026-11-22T01:57:55Z'
    section: LucidDaily Funded Account Benefits
- rule: daily_consistency_tiers
  description: LucidDaily is sold with three consistency tiers (30% add-on for the all-EOD configuration,
    40% standard, 50% add-on for the intraday configurations) and two drawdown types; this file is one
    of the documented configurations and the others are separate files.
  materiality: immaterial
  source:
    url: https://support.lucidtrading.com/en/articles/16033858-luciddaily-customization
    quote: These settings create unique LucidDaily account configurations to suit the trader.
    snapshot_sha256: 7519176da938e518fbe0d624ffab76c5bb1b754c26ba19292868582d285ba08b
