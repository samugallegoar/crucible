- rule: commission_table_not_published_per_root
  description: 'The firm publishes one all-in rate as an example (NQ, 2.88 USD per side) and defers every
    other instrument to each platform''s own pricing page, so ES, MES and MNQ have no known per-side commission
    and the firm''s platform list (Tradovate, NinjaTrader, TradingView) is not separated into per-platform
    tables. A run on an unpublished root has no known commission: its cost-dependent statistics stay unavailable
    unless a named cost assumption is supplied.'
  materiality: material
  source:
    url: https://helpfutures.fundednext.com/en/articles/17230203-how-do-commissions-work-in-futures-trading
    quote: You can look up the fees and commissions for a specific instrument on your platform's pricing
      page — simply search for the instrument to view its associated "Commission/Fees." For example, NinjaTrader's
      rates are available on the NinjaTrader Commissions page .
    snapshot_sha256: d3243eb03af444670f9475e44d99c4c3ef36dd85cbca4be7cfdd30c3cca71a02
    retrieved_at: '2026-11-22T03:55:08Z'
    section: What makes up the all-in rate?
    synthetic: false
- rule: cross_account_hedging
  description: Reverse hedges between accounts and hedging across highly correlated instruments are prohibited
    in both phases. A single simulated account cannot show a cross-account or a correlated hedge, and
    no rule kind screens for one, so a hedged strategy is reported as practically eligible when the firm
    would refuse it.
  materiality: material
  source:
    url: https://fundednext.com/general-rules/futures/what-is-forbidden
    quote: Reverse Hedge Opposite positions across accounts to guarantee a win. Hedging with Correlated
      Instruments Hedging across highly correlated instruments to artificially reduce risk.
    snapshot_sha256: f14ea4e53aae821953713acd2d5abc9f37a3493aaaa6e534ae2518c5147e5853
    retrieved_at: '2026-11-22T01:39:32Z'
    section: 1 Prohibited Strategies
    synthetic: false
- rule: prohibited_strategy_clauses
  description: Exploiting platform errors, account rolling and flipping, multi-order spam, slow-feed or
    latency advantage, spoofing, order-book layering, bracket, grid and wash strategies and trading gapped
    or illiquid markets are prohibited in both phases. These clauses are qualitative; a single simulated
    account cannot be screened for them, so a strategy that uses one is still reported as practically
    eligible.
  materiality: material
  source:
    url: https://fundednext.com/general-rules/futures/what-is-forbidden
    quote: Any practice that exploits simulated conditions, threatens platform stability, or undermines
      fair evaluation. Applies in both Challenge and FundedNext Account Phases.
    snapshot_sha256: f14ea4e53aae821953713acd2d5abc9f37a3493aaaa6e534ae2518c5147e5853
    retrieved_at: '2026-11-22T01:39:32Z'
    section: 1 Prohibited Strategies
    synthetic: false
- rule: sub_minute_holding_and_micro_scalping
  description: 'Trades closed within 10 seconds are measured as a share of the cycle''s recorded profit:
    30% draws a warning, and at 40% a Challenge holds advancement while a funded account deducts that
    share of the profit. No rule kind measures a trade''s holding time, so a sub-minute strategy is neither
    held nor deducted here and can pass that the firm would penalise.'
  materiality: material
  source:
    url: https://helpfutures.fundednext.com/en/articles/17430065-fundednext-futures-direct-account-all-rules
    quote: Micro-scalping is opening and closing trades within 10 seconds to capture small, rapid price
      movements. FundedNext Futures monitors a Micro-Scalping threshold across all account types. The
      Micro-Scalping percentage is the share of your total recorded profit from trades closed within 10
      seconds, evaluated per cycle. Only profitable trades count, you can close losing trades any time
      without affecting this rule. At 30%, you receive a compliance warning (no deduction). At 40% or
      above, the Micro-Scalping portion of your profit for that cycle is deducted in full. Your account
      is never terminated for micro-scalping, and future micro-scalping profit is subject to the same
      ongoing deduction.
    snapshot_sha256: 1176dff006412fa0d6b86f7d2c0a90583f7b02fa5717a8ccbd44651bd836ab5a
    retrieved_at: '2026-11-22T01:52:49Z'
    section: What is the Micro-Scalping policy for the FundedNext Futures Direct Account?
    synthetic: false
- rule: excess_contract_penalty
  description: 'Above the contract limit only the excess contracts are violations: their profit is deducted
    while their losses still count; max_contracts clips the order at admission instead, which keeps the
    excess contracts out of the book entirely.'
  materiality: immaterial
  source:
    url: https://helpfutures.fundednext.com/en/articles/17430065-fundednext-futures-direct-account-all-rules
    quote: 'If you exceed the limit, only the excess contracts are violations: profit from them is deducted
      , and losses still count.'
    snapshot_sha256: 1176dff006412fa0d6b86f7d2c0a90583f7b02fa5717a8ccbd44651bd836ab5a
    retrieved_at: '2026-11-22T01:52:49Z'
    section: Contract limits
    synthetic: false
- rule: reward_request_same_day_trade_rule
  description: A trade placed on the same day removes the transfer-to-wallet option for that day, so a
    request must be made on a day with no new trade; the payout rule evaluates at every rule-day close
    regardless of that day's trading, so a payout can be taken a day earlier than the firm would allow.
  materiality: immaterial
  source:
    url: https://helpfutures.fundednext.com/en/articles/17430065-fundednext-futures-direct-account-all-rules
    quote: 'Please note: placing a trade on the same day removes the transfer-to-wallet option for that
      day. So if you intend to request your Performance Reward, do it on a day when you haven''t opened
      a new trade; otherwise, you''ll need to wait until the next eligible day.'
    snapshot_sha256: 1176dff006412fa0d6b86f7d2c0a90583f7b02fa5717a8ccbd44651bd836ab5a
    retrieved_at: '2026-11-22T01:52:49Z'
    section: How do I request my Performance Reward from the FundedNext Futures Direct Account?
    synthetic: false
