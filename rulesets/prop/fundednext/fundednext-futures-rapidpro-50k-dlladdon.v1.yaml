  source:
    url: https://helpfutures.fundednext.com/en/articles/17230203-how-do-commissions-work-in-futures-trading
    quote: 'The all-in rate has three components: Commission — the fee charged by the broker for
      executing the trade. Exchange & NFA Fee — charged by the exchange and the National Futures
      Association. This fee doesn''t vary between brokerage firms, but does vary between
      different futures contracts . Clearing Fee — charged by the clearing firm (also known as
      an FCM). This can vary between brokerage firms , but doesn''t vary between futures
      contracts. You can look up the fees and commissions for a specific instrument on your
      platform''s pricing page — simply search for the instrument to view its associated
      "Commission/Fees." For example, NinjaTrader''s rates are available on the NinjaTrader
      Commissions page . How do I calculate the commission per trade? Because every trade has
      two sides — an entry (open) and an exit (close) — commissions and fees are charged twice .
      So always double the per-side rate to get your full cost: Commission per trade = Number of
      Contracts × All-in Rate × 2 Example You place a Buy trade of 3 contracts on the E-mini
      Nasdaq-100 (NQ), where the all-in rate is $2.88 per contract: 3 contracts × $2.88 × 2 =
      $17.28 So your total commission for opening and closing this trade would be $17.28 .'
    snapshot_sha256: d3243eb03af444670f9475e44d99c4c3ef36dd85cbca4be7cfdd30c3cca71a02
    retrieved_at: '2026-11-22T03:55:08Z'
    section: What makes up the all-in rate?
    synthetic: false
