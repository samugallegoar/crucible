      quote: Unlike the Challenge Phase, the Rapid Pro FundedNext Account applies a 40% Consistency Rule
        . If your highest profit in a single day is more than 40% of your total profit, you'll need to
        keep trading until your results become more consistent. There's no fixed number of days — it depends
