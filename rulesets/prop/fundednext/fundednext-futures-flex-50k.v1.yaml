- rule: sub_minute_holding_and_micro_scalping
  description: 'Trades closed within 10 seconds are measured as a share of the cycle''s recorded profit:
    30% draws a warning, and at 40% a Challenge holds advancement while a funded account deducts that
    share of the profit. No rule kind measures a trade''s holding time, so a sub-minute strategy is neither
    held nor deducted here and can pass that the firm would penalise.'
  materiality: material
  source:
    url: https://helpfutures.fundednext.com/en/articles/17229848-fundednext-futures-flex-fundednext-account-all-rules
    quote: 'Micro-scalping is opening and closing trades within 10 seconds to capture small, rapid price
      movements. FundedNext Futures monitors a Micro-Scalping threshold across all account types. On your
      FundedNext Account : The Micro-Scalping percentage is the share of your total recorded profit from
      trades closed within 10 seconds, evaluated per cycle . Only profitable trades count — you can close
      losing trades any time without affecting this rule. At 30% , you receive a compliance warning (no
      deduction). At 40% or above , the Micro-Scalping portion of your profit for that cycle is deducted
      in full . Your account is never terminated for micro-scalping, and future micro-scalping profit
      is subject to the same ongoing deduction.'
    snapshot_sha256: 387b6e0b8dd7b1e2e7a72ed8c61c3ccf2eafccffbc94044fd61ef0309a61ffc9
    retrieved_at: '2026-11-22T01:40:48Z'
