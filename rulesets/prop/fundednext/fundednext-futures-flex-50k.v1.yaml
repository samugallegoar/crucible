- rule: cross_account_hedging
  description: Reverse hedges between accounts and hedging across highly correlated instruments are prohibited
    in both phases. A single simulated account cannot show a cross-account or a correlated hedge, and
    no rule kind screens for one, so a hedged strategy is reported as practically eligible when the firm
    would refuse it.
    No single simulated account can show one, so the entry is immaterial here and names the fact
    that would make it bind (F5); the owner review of 2026-11-24 ruled the materiality
    immaterial, delegated to the coordinator 2026-11-24.
  materiality: immaterial
  becomes_immaterial_if: becomes material if several accounts, copy trading or coordinated strategies are simulated
  source:
