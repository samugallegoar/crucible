- rule: commission_table_not_published_per_root
  description: 'The firm publishes one all-in rate as an example (NQ, 2.88 USD per side) and defers every
    other instrument to each platform''s own pricing page, so ES, MES and MNQ have no known per-side commission
    and the firm''s platform list (Tradovate, NinjaTrader, TradingView) is not separated into per-platform
    tables. A run on an unpublished root has no known commission: its cost-dependent statistics stay unavailable
    unless a named cost assumption is supplied.'
  materiality: material
