    description: 'Flat, with no pending orders, at the 4:10 pm ET close of the trading day: anything still
      open is liquidated at the close and the trading day reopens at 6:00 pm ET. The deadline is declared
      relative to the CME session''s scheduled close (minutes_before_session_end: 50, because 4:10 pm ET
      is fifty minutes before the 5:00 pm ET / 4:00 pm CT close of a regular equity-index session), so a
      holiday early close moves it with the calendar instead of a fixed clock. On an early-close day the
      flat instant lands fifty minutes before that early close, earlier than the firm''s own deadline for
      the day, which is the conservative side. A session-relative close carries no clock time zone, so no
      reopen clock is declared: the trading day''s 6:00 pm ET start is the reset clock above, and entries
      stay blocked until the session closes. A session the CME table cannot source is reported by the
      engine as a coverage gap, never treated as a regular day.'
