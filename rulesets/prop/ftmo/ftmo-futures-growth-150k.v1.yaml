- rule: inactivity_warning_30_days
  description: A warning is issued after 30 consecutive calendar days without trading activity, and
    the account is closed after a further 30 days. The warning is not modeled as a rule because it
    changes no simulated outcome; funded_inactivity at 60 days is the close. Declared here as an
    immaterial entry so the page's own two-step clock is on record.
  materiality: immaterial
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: Accounts on which no trading activity has been recorded for 30 consecutive calendar days
      will receive an automated inactivity warning.
