    synthetic: false
- rule: live_funded_account
  description: The Live Funded Account is a separate, invitation-only account with its own capital (initial
    capital equal to the Maximum Drawdown Amount), a one-time buffer/Safety Net, uncapped daily payouts
    at 90/10, no daily loss limit and no consistency rule, plus a market data fee for live data that the
    page states without an amount. It is not a pass transition the phase chain can enter, and its capital
    is not published per size, so nothing simulated changes.
  materiality: immaterial
  becomes_immaterial_if: becomes material if the Live Funded Account is simulated as a third phase, with its
    uncapped payouts and its market data fee
  source:
    url: https://ftmo.com/en/futures/how-it-works/
    quote: 'Not automatic: the Live Funded Account is offered by invitation only, after FTMO validates
      your Sim-Funded trading.'
    snapshot_sha256: 8e3659d8587843006b15d0eda1599339fa8e3e97fbb65dea7fc3c6cdcf9521e8
    retrieved_at: '2026-11-22T01:35:37Z'
    section: Live Funded Account
    synthetic: false
- rule: cme_price_limit_2pct_entry_ban
  description: No new position may be opened while price is within 2% of the CME daily price limit for
    the contract and session. There is no entry-distance kind and the ruleset carries no price-limit series,
    so a strategy trading near a limit is admitted when FTMO would refuse it.
  materiality: material
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: You must not open new positions in any contract when price is within 2% of the CME-defined
      daily price limit for that contract and session.
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Prohibited Trading Practices 6
    synthetic: false
- rule: cross_account_hedging
  description: 'Simultaneously holding opposing positions across FTMO accounts, products or other
    operators is prohibited: the cross-firm id for this rule is cross_account_hedging. One simulated
    account cannot express netting across accounts, and inside one account an opposite position is
    not netting.'

  materiality: immaterial
  becomes_immaterial_if: becomes material if several accounts, copy trading or coordinated strategies are simulated
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: You must not perform, alone or in concert with other persons, trades or combinations of trades
      designed to eliminate or reduce directional market risk. This includes simultaneously holding opposing
      positions across accounts held with FTMO Futures, other FTMO products, or any other operator or
      platform.
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Prohibited Trading Practices 3
    synthetic: false
- rule: discretionary_risk_management_clause
  description: A strategy that relies on the drawdown as its only exit, overleverages, makes one-sided
    bets or rolls accounts can lose the account at FTMO's discretion. A discretionary clause cannot be
    simulated, so a strategy the firm would refuse still passes here.
  materiality: material
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: or engage in trading that would not reflect the risk management discipline expected of a professional
      trader operating with real capital in live market conditions.
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Prohibited Trading Practices 2 and 8
    synthetic: false
- rule: inconsistent_position_sizing
  description: Position sizes or trade counts that differ substantially from the trader's wider activity
    across accounts are prohibited. The ruleset has no cross-account sizing rule and a single-account
    attempt has no wider activity to compare with.
  materiality: material
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: Opening substantially larger or smaller position sizes, or a substantially different number
      of positions, relative to your broader trading activity across your accounts
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Risk Management Standards
    synthetic: false
- rule: news_event_concentration
  description: 'Clustering trading activity around scheduled economic events in a pattern inconsistent
    with the trader''s overall approach is prohibited. FTMO states there is no special news restriction,
    so this is a discretionary, unspecified news rule rather than a window: no event types, minutes or
    instruments are published, and there is nothing to model as a news_restriction.'
  materiality: material
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: Concentrating trading activity around scheduled economic events in a pattern that is inconsistent
      with your overall approach and would not reflect a sustainable strategy in live market conditions
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Risk Management Standards
    synthetic: false
- rule: evaluation_vs_funded_mismatch
  description: Trading in a materially different manner in the evaluation than intended on a funded account,
    or using risk parameters in the evaluation that would not be used with real capital, is prohibited.
    The simulation applies one strategy to both phases, so the modelled attempt cannot express the mismatch.
  materiality: immaterial
  becomes_immaterial_if: becomes material if a run compares one strategy's evaluation parameters with another
    strategy's funded parameters
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: Trading in a materially different manner during the evaluation than you intend to trade on
      a funded account, or employing risk parameters during evaluation that you would not reasonably apply
      when trading with real capital.
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Risk Management Standards
    synthetic: false
- rule: exploit_simulation_artifacts
  description: Strategies that exploit errors in FTMO's services, price-update delays or any characteristic
    specific to a simulated environment are prohibited. The engine simulates no platform errors or quote
    delays, so there is nothing to exploit.
  materiality: immaterial
  becomes_immaterial_if: becomes material if the simulation models platform errors, delayed price updates or other
    artefacts of a simulated environment
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: You must not use any trading strategy intended to exploit, game, or undermine the purpose or
      spirit of the programme; including strategies that take advantage of errors in our Services, delays
      in price updates, or any characteristic specific to a simulated environment that would not be present
      in a live futures market, whether or not you were aware of the exploitation.
    snapshot_sha256: de1eb1d68e84f734a53caf23cf673043e869213c0adf5b6eb3a15bc5038dd39b
    retrieved_at: '2026-11-22T01:35:38Z'
    section: Prohibited Trading Practices 1
    synthetic: false
- rule: max_concurrent_accounts_3
  description: At most 3 concurrent Sim-Funded accounts across sizes and products; a per-account attempt
    cannot model a portfolio of accounts.
  materiality: immaterial
  becomes_immaterial_if: becomes material if several accounts are simulated at the same time for one trader
  source:
    url: https://ftmo.com/en/futures/trading-objectives-and-rules/
    quote: You may hold a maximum of 3 concurrent Sim-Funded Accounts at any one time, across all account
