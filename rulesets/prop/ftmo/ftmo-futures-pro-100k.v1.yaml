- rule: hft_and_latency_arbitrage_ban
  description: High-frequency strategies and latency arbitrage are prohibited on top of the permitted
    use of automation. A bar-based simulation has no order latency to arbitrage, and a strategy that the
    firm would treat as HFT is not detectable from its simulated trades.
  materiality: immaterial
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
    quote: Automated trading is permitted. You must not, however, use software, artificial intelligence,
