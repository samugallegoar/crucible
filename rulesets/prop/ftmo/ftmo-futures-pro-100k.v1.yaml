- rule: exploit_simulation_artifacts
  description: Strategies that exploit errors in FTMO's services, price-update delays or any characteristic
    specific to a simulated environment are prohibited. The engine simulates no platform errors or quote
    delays, so there is nothing to exploit.
  materiality: immaterial
  source:
    url: https://ftmo.com/en/futures/forbidden-trading-practices/
