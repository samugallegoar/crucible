# Buy-cheap-UP on the imported Polymarket BTC five-minute contracts (docs/data/polymarket-btc5m-csv.md).
# Bars hold the bid/ask mid with zero volume, so fills pay no spread: results are optimistic
# (ADR-0052). Build the datasets first:
#   uv run crucible data build examples/imports/polymarket_csv.yaml --store data/processed
experiment:
  name: polymarket_up_real
  family: polymarket_up_real
  mode: evaluation
  seed: 5
  realism_level: 1

data:
  store: data/processed
  bars: polymarket_btc5m_csv_v1
  corporate_actions: polymarket_btc5m_csv_v1_actions
  calendar: "24/7"
  base_currency: USD
  quality_skip: [calendar_coverage]
  quality_skip_reason: contracts trade only inside their five-minute windows

strategy:
  entrypoint: examples.real_data.polymarket_up:BuyCheapUp
  params:
    threshold: 0.45
    quantity: 100

execution:
  slippage_bps: 0.0
  commission_bps: 0.0

initial_cash: "10000"
start: "2026-02-23"
end: "2026-03-06"
periods_per_year: 105120.0
